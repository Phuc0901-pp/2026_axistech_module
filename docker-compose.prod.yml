services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "max_connections=60"]
    env_file:
      - ./.env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axistech_erp}
      POSTGRES_USER: ${POSTGRES_USER:-agtech_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - pg_data:/var/lib/postgresql/data
    networks:
      - agtech_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agtech_admin} -d ${POSTGRES_DB:-axistech_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  axisstream-bridge:
    build:
      context: ./services/axisstream-bridge
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env.prod
    environment:
      AXISSTREAM_SQLITE_PATH: /data/bridge_state.db
      AXISSTREAM_DATABASE_URL: postgresql://${POSTGRES_USER:-agtech_admin}:${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-axistech_erp}
    volumes:
      - bridge_data:/data
    networks:
      - agtech_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  erp-platform:
    build:
      context: ./services/erp-platform
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      axisstream-bridge:
        condition: service_healthy
    env_file:
      - ./.env.prod
    environment:
      ERP_PORT: 8080
      BRIDGE_BASE_URL: http://axisstream-bridge:8001
      ERP_DATA_FILE_PATH: /data/erp_state.json
      ERP_DATABASE_URL: postgresql://${POSTGRES_USER:-agtech_admin}:${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-axistech_erp}
      ERP_REQUIRE_API_KEY: ${ERP_REQUIRE_API_KEY:-true}
    expose:
      - "8080"
    volumes:
      - erp_data:/data
    networks:
      - agtech_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      erp-platform:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - agtech_internal

  cloudflared:
    profiles:
      - tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      erp-platform:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - agtech_internal

volumes:
  pg_data:
  bridge_data:
  erp_data:
  caddy_data:
  caddy_config:

networks:
  agtech_internal:
    driver: bridge
